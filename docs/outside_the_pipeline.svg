<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 200" role="img" aria-label="Pod logs are converted to CSV by parsing_tools/pod_logs.py, which parbakery.py measures into par-baked Croissants, which bakery finishes. pod_logs.py imports parbakery's worker count, start method and progress display; bakery imports parbake's Markdown renderer, folder names and par-baked markers.">
<style>
  .node { fill: #FFFFFF; stroke: #9AA6B2; stroke-width: 1; }
  .group { fill: #E9EDF2; stroke: #9AA6B2; stroke-width: 1; }
  .region, .person { fill: #F2F4F7; stroke: #2656A6; stroke-width: 1.25; stroke-dasharray: 7 5; }
  .region-behind { fill: #F2F4F7; stroke: #9AA6B2; stroke-width: 1; stroke-dasharray: 7 5; }
  .table-row { fill: #FFFFFF; stroke: #C9D1D9; stroke-width: 1; }
  .folder { fill: none; stroke: #9AA6B2; stroke-width: 1; stroke-dasharray: 2 4; }
  .file { fill: #FFFFFF; stroke: #C9D1D9; stroke-width: 1; }
  .edge { fill: none; stroke: #5A6673; stroke-width: 1.25; }
  .edge-accent { stroke: #2656A6; }
  .edge-dashed { stroke-dasharray: 5 4; }
  .t-name { font-family: 'IBM Plex Mono', Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; fill: #17212C; }
  .t-title { font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #17212C; }
  .t-sub, .t-label { font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; font-size: 11px; fill: #5A6673; }
  .t-file { font-family: 'IBM Plex Mono', Menlo, Consolas, monospace; font-size: 11px; fill: #17212C; }
  .t-table { font-family: 'IBM Plex Mono', Menlo, Consolas, monospace; font-size: 11px; font-weight: 500; fill: #17212C; }
  .t-cluster { font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.05em; fill: #5A6673; }
  .t-region { font-family: 'IBM Plex Mono', Menlo, Consolas, monospace; font-size: 11px; font-weight: 500; fill: #2656A6; }
  .t-folder { font-family: 'IBM Plex Mono', Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; fill: #17212C; }
  .t-label-accent { font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; font-size: 11px; fill: #2656A6; }
  .t-key { font-family: 'IBM Plex Mono', Menlo, Consolas, monospace; font-size: 11px; font-weight: 600; fill: #2656A6; }
  .m-ink path { fill: #5A6673; }
  .m-accent path { fill: #2656A6; }
</style>
<rect width="100%" height="100%" fill="#F2F4F7"/>
          <defs>
            <marker id="arrow2" class="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker>
          </defs>

          <rect class="node" x="20" y="110" width="180" height="64" rx="3"/>
          <text class="t-title" x="110" y="137" text-anchor="middle">Kubernetes pod logs</text>
          <text class="t-sub" x="110" y="155" text-anchor="middle">*.txt, one JSON record per line</text>

          <rect class="node" x="313" y="110" width="180" height="64" rx="3"/>
          <text class="t-name" x="403" y="137" text-anchor="middle">pod_logs.py</text>
          <text class="t-sub" x="403" y="155" text-anchor="middle">parsing_tools/, run by hand</text>

          <rect class="node" x="606" y="110" width="180" height="64" rx="3"/>
          <text class="t-name" x="696" y="137" text-anchor="middle">parbakery.py</text>
          <text class="t-sub" x="696" y="155" text-anchor="middle">measures each CSV</text>

          <rect class="node" x="899" y="110" width="180" height="64" rx="3"/>
          <text class="t-title" x="989" y="137" text-anchor="middle">bakery</text>
          <text class="t-sub" x="989" y="155" text-anchor="middle">separate repository</text>

          <line class="edge" x1="200" y1="142" x2="311" y2="142" marker-end="url(#arrow2)"/>
          <text class="t-label" x="256" y="134" text-anchor="middle">reads</text>
          <line class="edge" x1="493" y1="142" x2="604" y2="142" marker-end="url(#arrow2)"/>
          <text class="t-label" x="549" y="134" text-anchor="middle">.parsed.csv</text>
          <line class="edge" x1="786" y1="142" x2="897" y2="142" marker-end="url(#arrow2)"/>
          <text class="t-label" x="842" y="134" text-anchor="middle">.parbaked.json</text>

          <path class="edge edge-dashed" d="M403,110 V80 H656 V108" marker-end="url(#arrow2)"/>
          <text class="t-label" x="530" y="58" text-anchor="middle">imports worker_count, _pool_context</text>
          <text class="t-label" x="530" y="72" text-anchor="middle">and progress.ProgressDisplay</text>

          <path class="edge edge-dashed" d="M989,110 V80 H736 V108" marker-end="url(#arrow2)"/>
          <text class="t-label" x="862" y="58" text-anchor="middle">imports render_markdown,</text>
          <text class="t-label" x="862" y="72" text-anchor="middle">folder names, par-baked markers</text>
        </svg>
